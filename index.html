<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo WebRTC Game</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
    .screen { display: none; margin-top: 30px; }
    .active { display: block; }
    button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 6px; border: none; background: #e67e22; color: white; font-weight: bold; }
    input { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; text-align: center; }
    #board { width: 280px; height: 280px; border: 4px solid #fff; margin: 20px auto; display: flex; align-items: center; justify-content: center; background: #1e1e2e; border-radius: 12px; }
  </style>
</head>
<body>

  <div id="title-screen" class="screen active">
    <h1 style="color:#f39c12;">LUDO MULTIPLAYER</h1>
    <button onclick="showScreen('multiplayer-screen')">Online Game</button>
  </div>

  <div id="multiplayer-screen" class="screen">
    <h2>Online Lobby</h2>
    <input type="text" id="player-name" placeholder="Enter Your Name"><br><br>
    <button onclick="hostGame()">Host Game</button>
    <button onclick="showScreen('join-screen')">Join Game</button>
  </div>

  <div id="join-screen" class="screen">
    <h2>Join Room</h2>
    <input type="text" id="room-code-input" placeholder="Enter 4-Digit Code"><br><br>
    <button onclick="joinGame()">Enter Room</button>
  </div>

  <div id="lobby-screen" class="screen">
    <h2>Room Code: <span id="code-display" style="color:#f39c12"></span></h2>
    <p>Connected Peers: <span id="peer-count">1</span>/4</p>
    <button id="start-btn" style="display:none;" onclick="startGame()">Start Game</button>
  </div>

  <div id="game-screen" class="screen">
    <h2 id="turn-display">Turn: Red</h2>
    <div id="board">
      <div id="dice-display" style="font-size: 36px;">🎲 -</div>
    </div>
    <button id="roll-btn" onclick="rollDice()">Roll Dice (P2P)</button>
  </div>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);

    const peerConnections = {};
    const dataChannels = {};

    let myId = null;
    let myColor = null;
    let roomCode = null;
    let isHost = false;

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    ws.onmessage = async (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'ROOM_CREATED' || data.type === 'JOINED_SUCCESS') {
        myId = data.playerId;
        myColor = data.color;
        roomCode = data.roomCode;
        document.getElementById('code-display').innerText = roomCode;
        if (isHost) document.getElementById('start-btn').style.display = 'inline-block';
        showScreen('lobby-screen');
      }

      if (data.type === 'NEW_PLAYER_JOINED') {
        createPeerConnection(data.peerId, true);
      }

      if (data.type === 'OFFER') {
        const pc = createPeerConnection(data.senderId, false);
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'ANSWER', answer, targetId: data.senderId }));
      }

      if (data.type === 'ANSWER') {
        const pc = peerConnections[data.senderId];
        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      }

      if (data.type === 'ICE_CANDIDATE') {
        const pc = peerConnections[data.senderId];
        if (pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    };

    function createPeerConnection(peerId, isInitiator) {
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[peerId] = pc;

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          ws.send(JSON.stringify({ type: 'ICE_CANDIDATE', candidate: e.candidate, targetId: peerId }));
        }
      };

      if (isInitiator) {
        const dc = pc.createDataChannel('gameData');
        setupDataChannel(dc, peerId);
        pc.createOffer().then(offer => {
          pc.setLocalDescription(offer);
          ws.send(JSON.stringify({ type: 'OFFER', offer, targetId: peerId }));
        });
      } else {
        pc.ondatachannel = (e) => setupDataChannel(e.channel, peerId);
      }

      return pc;
    }

    function setupDataChannel(dc, peerId) {
      dataChannels[peerId] = dc;
      dc.onopen = () => {
        document.getElementById('peer-count').innerText = Object.keys(dataChannels).length + 1;
      };
      dc.onmessage = (e) => handleP2PMessage(JSON.parse(e.data));
    }

    function hostGame() {
      isHost = true;
      const name = document.getElementById('player-name').value || 'Host';
      ws.send(JSON.stringify({ type: 'CREATE_ROOM', name }));
    }

    function joinGame() {
      isHost = false;
      const name = document.getElementById('player-name').value || 'Player';
      const code = document.getElementById('room-code-input').value.trim();
      ws.send(JSON.stringify({ type: 'JOIN_ROOM', roomCode: code, name }));
    }

    function startGame() {
      broadcastP2P({ type: 'START_GAME' });
      showScreen('game-screen');
    }

    function broadcastP2P(data) {
      Object.values(dataChannels).forEach(dc => {
        if (dc.readyState === 'open') dc.send(JSON.stringify(data));
      });
    }

    function rollDice() {
      const val = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-display').innerText = `🎲 ${val}`;
      broadcastP2P({ type: 'DICE_ROLLED', value: val, color: myColor });
    }

    function handleP2PMessage(data) {
      if (data.type === 'START_GAME') showScreen('game-screen');
      if (data.type === 'DICE_ROLLED') {
        document.getElementById('dice-display').innerText = `🎲 ${data.value}`;
        document.getElementById('turn-display').innerText = `${data.color} rolled a ${data.value}!`;
      }
    }
  </script>
</body>
</html>
