<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Master - Official Rules Engine</title>
  <style>
    * { box-sizing: border-box; font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif; }
    body {
      background: radial-gradient(circle, #1a5276 0%, #0e2439 100%);
      color: white; margin: 0; padding: 10px;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .screen { display: none; width: 100%; max-width: 420px; text-align: center; }
    .active { display: flex; flex-direction: column; align-items: center; }
    
    h1 { color: #f39c12; text-shadow: 0 3px 0 #b9770e; margin: 15px 0; }
    
    .card {
      background: #0d3b66; border: 3px solid #f39c12; border-radius: 12px;
      padding: 20px; width: 100%; box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }

    button {
      background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
      color: white; border: 2px solid #fff; border-radius: 20px;
      padding: 10px 20px; font-size: 16px; font-weight: bold; margin: 8px;
      cursor: pointer; text-shadow: 0 1px 2px #000; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    input, select {
      padding: 10px; font-size: 15px; border-radius: 8px; border: 2px solid #f39c12;
      background: #001a33; color: white; width: 85%; margin-bottom: 12px; text-align: center;
    }

    /* Game Layout */
    #game-layout { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
    .status-header { width: 100%; background: rgba(0,0,0,0.4); border-radius: 8px; padding: 6px; margin-bottom: 8px; font-size: 13px; }

    /* Ludo Board */
    #ludo-board {
      width: 360px; height: 360px; display: grid;
      grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr);
      background: #fff; border: 4px solid #111; border-radius: 4px; position: relative;
    }

    .cell { border: 0.5px solid #ccc; display: flex; align-items: center; justify-content: center; position: relative; font-size: 10px; }
    
    .bg-red { background: #e74c3c !important; }
    .bg-green { background: #2ecc71 !important; }
    .bg-yellow { background: #f1c40f !important; }
    .bg-blue { background: #3498db !important; }

    .base { position: absolute; width: 40%; height: 40%; border: 2px solid #111; display: flex; align-items: center; justify-content: center; }
    .base-red { top: 0; left: 0; background: #e74c3c; }
    .base-green { top: 0; right: 0; background: #2ecc71; }
    .base-yellow { bottom: 0; right: 0; background: #f1c40f; }
    .base-blue { bottom: 0; left: 0; background: #3498db; }
    
    .base-inner { width: 70%; height: 70%; background: #fff; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; padding: 6px; gap: 6px; }

    /* Custom Goti / Token Styling */
    .goti {
      width: 18px; height: 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      border: 2px solid #fff; box-shadow: 0 3px 5px rgba(0,0,0,0.6);
      cursor: pointer; z-index: 10; transition: transform 0.2s;
    }
    .goti.selectable { animation: bounce 0.6s infinite alternate; }
    @keyframes bounce { 0% { transform: scale(1); } 100% { transform: scale(1.3); } }

    .goti-Blue { background: radial-gradient(circle at 30% 30%, #5dade2, #1b4f72); }
    .goti-Red { background: radial-gradient(circle at 30% 30%, #ec7063, #78281f); }
    .goti-Green { background: radial-gradient(circle at 30% 30%, #58d68d, #145a32); }
    .goti-Yellow { background: radial-gradient(circle at 30% 30%, #f9e79f, #7d6608); }

    .center-home {
      grid-column: 7 / 10; grid-row: 7 / 10;
      background: conic-gradient(#e74c3c 0 90deg, #2ecc71 90deg 180deg, #f1c40f 180deg 270deg, #3498db 270deg 360deg);
      border: 1px solid #111;
    }

    .controls-panel { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .dice-box {
      width: 55px; height: 55px; background: #fff; border: 3px solid #f39c12;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; color: #000; box-shadow: 0 4px 6px rgba(0,0,0,0.4); cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Main Menu -->
  <div id="title-screen" class="screen active">
    <h1>LUDO MASTER</h1>
    <div class="card">
      <button onclick="openOnlineMenu()">Online Multiplayer</button><br>
      <button onclick="openOfflineMenu()">Pass & Play (Offline)</button>
    </div>
  </div>

  <!-- Screen 2: Mode Settings -->
  <div id="mode-screen" class="screen">
    <h2 id="mode-screen-title">Game Settings</h2>
    <div class="card">
      <input type="text" id="player-name" placeholder="Enter Your Name"><br>
      
      <label style="display:block; margin: 10px 0 5px;">Number of Players:</label>
      <select id="player-count-select">
        <option value="2">2 Players</option>
        <option value="3">3 Players</option>
        <option value="4" selected>4 Players</option>
      </select><br>

      <div id="online-actions">
        <button onclick="hostGame()">Host Game</button><br>
        <button onclick="showScreen('join-screen')">Join Game</button>
      </div>

      <div id="offline-actions" style="display:none;">
        <button onclick="startOfflineGame()">Start Game</button>
      </div>

      <br><button style="background:#555;" onclick="showScreen('title-screen')">Back</button>
    </div>
  </div>

  <!-- Screen 3: Join Room -->
  <div id="join-screen" class="screen">
    <h2>Join Room</h2>
    <div class="card">
      <input type="text" id="room-code-input" placeholder="Enter 4-Digit Code"><br>
      <button onclick="joinGame()">Enter Room</button><br>
      <button style="background:#555;" onclick="showScreen('mode-screen')">Back</button>
    </div>
  </div>

  <!-- Screen 4: Lobby -->
  <div id="lobby-screen" class="screen">
    <h2>Room Code: <span id="code-display" style="color:#f39c12"></span></h2>
    <div class="card">
      <p>Connected: <span id="peer-count">1</span>/<span id="max-peer-count">4</span></p>
      <button id="start-btn" style="display:none;" onclick="startGame()">Start Play</button>
    </div>
  </div>

  <!-- Screen 5: Game Board -->
  <div id="game-screen" class="screen">
    <div id="game-layout">
      <div class="status-header">
        <span id="turn-display" style="color:#f39c12; font-weight:bold;">Turn: Blue</span>
        <div id="rule-message" style="font-size:11px; color:#aaa;">Roll the dice to start</div>
      </div>

      <div id="ludo-board">
        <div class="base base-red">
          <div class="base-inner">
            <div class="cell" id="base-Red-0"></div><div class="cell" id="base-Red-1"></div>
            <div class="cell" id="base-Red-2"></div><div class="cell" id="base-Red-3"></div>
          </div>
        </div>
        <div class="base base-green">
          <div class="base-inner">
            <div class="cell" id="base-Green-0"></div><div class="cell" id="base-Green-1"></div>
            <div class="cell" id="base-Green-2"></div><div class="cell" id="base-Green-3"></div>
          </div>
        </div>
        <div class="base base-yellow">
          <div class="base-inner">
            <div class="cell" id="base-Yellow-0"></div><div class="cell" id="base-Yellow-1"></div>
            <div class="cell" id="base-Yellow-2"></div><div class="cell" id="base-Yellow-3"></div>
          </div>
        </div>
        <div class="base base-blue">
          <div class="base-inner">
            <div class="cell" id="base-Blue-0"></div><div class="cell" id="base-Blue-1"></div>
            <div class="cell" id="base-Blue-2"></div><div class="cell" id="base-Blue-3"></div>
          </div>
        </div>

        <div class="center-home"></div>
      </div>

      <div class="controls-panel">
        <div style="text-align:left;">
          <small>Current Player</small><br>
          <strong id="active-player-name" style="color:#3498db;">Blue</strong>
        </div>
        <div class="dice-box" id="dice-display" onclick="handleDiceClick()">🎲</div>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    const peerConnections = {};
    const dataChannels = {};

    let myColor = null;
    let isHost = false;
    let isOffline = false;
    let maxPlayers = 4;
    
    const activeColors = ['Blue', 'Red', 'Green', 'Yellow'];
    let currentTurnIndex = 0;
    let currentRoll = null;
    let consecutiveSixes = 0;
    let diceRolledThisTurn = false;

    // Track state of all 16 gotis (4 per color)
    // -1 = Base, 0..50 = Common Path, 51..55 = Home Path, 56 = Finished
    const gameState = {
      Blue: [-1, -1, -1, -1],
      Red: [-1, -1, -1, -1],
      Green: [-1, -1, -1, -1],
      Yellow: [-1, -1, -1, -1]
    };

    // Safe cells on common path
    const safeCells = [1, 9, 14, 22, 27, 35, 40, 48];
    const colorOffsets = { Blue: 1, Red: 14, Green: 27, Yellow: 40 };

    const gridCoordinates = {
      // Mapping common path 0..51 to row/col
      1: [14, 7], 2: [13, 7], 3: [12, 7], 4: [11, 7], 5: [10, 7], 6: [9, 6], 7: [9, 5], 8: [9, 4], 9: [9, 3], 10: [9, 2], 11: [9, 1], 12: [8, 1], 13: [7, 1],
      14: [7, 2], 15: [7, 3], 16: [7, 4], 17: [7, 5], 18: [7, 6], 19: [6, 7], 20: [5, 7], 21: [4, 7], 22: [3, 7], 23: [2, 7], 24: [1, 7], 25: [1, 8], 26: [1, 9],
      27: [2, 9], 28: [3, 9], 29: [4, 9], 30: [5, 9], 31: [6, 9], 32: [7, 10], 33: [7, 11], 34: [7, 12], 35: [7, 13], 36: [7, 14], 37: [7, 15], 38: [8, 15], 39: [9, 15],
      40: [9, 14], 41: [9, 13], 42: [9, 12], 43: [9, 11], 44: [9, 10], 45: [10, 9], 46: [11, 9], 47: [12, 9], 48: [13, 9], 49: [14, 9], 50: [15, 9], 51: [15, 8], 0: [15, 7]
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function initWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'ERROR') return alert(data.msg);

        if (data.type === 'ROOM_CREATED' || data.type === 'JOINED_SUCCESS') {
          myColor = data.color;
          maxPlayers = data.maxPlayers;
          document.getElementById('code-display').innerText = data.roomCode;
          document.getElementById('max-peer-count').innerText = maxPlayers;
          if (isHost) document.getElementById('start-btn').style.display = 'inline-block';
          showScreen('lobby-screen');
        }

        if (data.type === 'NEW_PLAYER_JOINED') createPeerConnection(data.peerId, true);
        if (data.type === 'OFFER') {
          const pc = createPeerConnection(data.senderId, false);
          await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: 'ANSWER', answer, targetId: data.senderId }));
        }
        if (data.type === 'ANSWER') {
          const pc = peerConnections[data.senderId];
          if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
        if (data.type === 'ICE_CANDIDATE') {
          const pc = peerConnections[data.senderId];
          if (pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      };
    }

    function openOnlineMenu() {
      isOffline = false;
      document.getElementById('online-actions').style.display = "block";
      document.getElementById('offline-actions').style.display = "none";
      initWebSocket();
      showScreen('mode-screen');
    }

    function openOfflineMenu() {
      isOffline = true;
      document.getElementById('online-actions').style.display = "none";
      document.getElementById('offline-actions').style.display = "block";
      showScreen('mode-screen');
    }

    function setupGrid() {
      const board = document.getElementById('ludo-board');
      for (let r = 1; r <= 15; r++) {
        for (let c = 1; c <= 15; c++) {
          if ((r <= 6 && c <= 6) || (r <= 6 && c >= 10) || (r >= 10 && c <= 6) || (r >= 10 && c >= 10) || (r >= 7 && r <= 9 && c >= 7 && c <= 9)) continue;
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;
          cell.style.gridRow = r;
          cell.style.gridColumn = c;

          if (r === 8 && c >= 2 && c <= 6) cell.classList.add('bg-blue');
          if (c === 8 && r >= 2 && r <= 6) cell.classList.add('bg-red');
          if (r === 8 && c >= 10 && c <= 14) cell.classList.add('bg-yellow');
          if (c === 8 && r >= 10 && r <= 14) cell.classList.add('bg-green');

          if ((r === 7 && c === 2) || (r === 3 && c === 9) || (r === 9 && c === 14) || (r === 13 && c === 7)) cell.innerHTML = '⭐';
          board.appendChild(cell);
        }
      }
    }
    setupGrid();

    function renderBoard() {
      document.querySelectorAll('.goti').forEach(e => e.remove());

      activeColors.slice(0, maxPlayers).forEach(color => {
        gameState[color].forEach((pos, idx) => {
          const goti = document.createElement('div');
          goti.className = `goti goti-${color}`;
          goti.onclick = () => handleGotiClick(color, idx);

          if (pos === -1) {
            document.getElementById(`base-${color}-${idx}`).appendChild(goti);
          } else if (pos < 51) {
            const absPos = (pos + colorOffsets[color]) % 52;
            const [r, c] = gridCoordinates[absPos];
            document.getElementById(`cell-${r}-${c}`).appendChild(goti);
          } else if (pos >= 51 && pos < 56) {
            // Home stretch
            const offset = pos - 51;
            let r, c;
            if (color === 'Blue') { r = 8; c = 2 + offset; }
            if (color === 'Red') { r = 2 + offset; c = 8; }
            if (color === 'Green') { r = 8; c = 14 - offset; }
            if (color === 'Yellow') { r = 14 - offset; c = 8; }
            document.getElementById(`cell-${r}-${c}`).appendChild(goti);
          }
        });
      });
    }

    function handleDiceClick() {
      const currentColor = activeColors[currentTurnIndex];
      if (!isOffline && currentColor !== myColor) return;
      if (diceRolledThisTurn) return;

      currentRoll = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-display').innerText = currentRoll;
      diceRolledThisTurn = true;

      if (currentRoll === 6) {
        consecutiveSixes++;
        if (consecutiveSixes === 3) {
          document.getElementById('rule-message').innerText = "3 consecutive 6s! Turn lost.";
          resetTurn(false);
          return;
        }
      } else {
        consecutiveSixes = 0;
      }

      // Check available moves
      const moveable = getMoveableGotis(currentColor, currentRoll);
      if (moveable.length === 0) {
        document.getElementById('rule-message').innerText = "No valid moves available.";
        setTimeout(() => resetTurn(false), 1000);
      } else {
        document.getElementById('rule-message').innerText = "Select a goti to move.";
        highlightGotis(currentColor, moveable);
      }

      if (!isOffline) broadcastP2P({ type: 'DICE_ROLLED', roll: currentRoll, color: currentColor });
    }

    function getMoveableGotis(color, roll) {
      const moveable = [];
      gameState[color].forEach((pos, idx) => {
        if (pos === -1 && roll === 6) moveable.push(idx);
        else if (pos >= 0 && pos < 56 && (pos + roll <= 56)) moveable.push(idx);
      });
      return moveable;
    }

    function highlightGotis(color, indices) {
      indices.forEach(idx => {
        const gotis = document.querySelectorAll(`.goti-${color}`);
        if (gotis[idx]) gotis[idx].classList.add('selectable');
      });
    }

    function handleGotiClick(color, gotiIdx) {
      const currentColor = activeColors[currentTurnIndex];
      if (color !== currentColor || !diceRolledThisTurn || !currentRoll) return;

      const moveable = getMoveableGotis(color, currentRoll);
      if (!moveable.includes(gotiIdx)) return;

      let extraTurn = currentRoll === 6;
      let pos = gameState[color][gotiIdx];

      if (pos === -1 && currentRoll === 6) {
        gameState[color][gotiIdx] = 0; // Move out to start position
      } else {
        pos += currentRoll;
        gameState[color][gotiIdx] = pos;

        // Check capture on common path
        if (pos < 51) {
          const absPos = (pos + colorOffsets[color]) % 52;
          if (!safeCells.includes(absPos)) {
            activeColors.slice(0, maxPlayers).forEach(oppColor => {
              if (oppColor !== color) {
                gameState[oppColor].forEach((oppPos, oppIdx) => {
                  if (oppPos >= 0 && oppPos < 51) {
                    const oppAbsPos = (oppPos + colorOffsets[oppColor]) % 52;
                    if (oppAbsPos === absPos) {
                      gameState[oppColor][oppIdx] = -1; // Send back to base
                      extraTurn = true; // Capture bonus turn
                      document.getElementById('rule-message').innerText = `${color} captured ${oppColor}! Bonus turn!`;
                    }
                  }
                });
              }
            });
          }
        }
      }

      renderBoard();
      
      // Check Win
      if (gameState[color].every(p => p === 56)) {
        alert(`${color} wins the game!`);
        return;
      }

      if (!isOffline) broadcastP2P({ type: 'MOVE_MADE', gameState });

      resetTurn(extraTurn);
    }

    function resetTurn(extraTurn) {
      diceRolledThisTurn = false;
      document.querySelectorAll('.goti').forEach(e => e.classList.remove('selectable'));

      if (!extraTurn) {
        currentTurnIndex = (currentTurnIndex + 1) % maxPlayers;
        consecutiveSixes = 0;
      }

      const nextColor = activeColors[currentTurnIndex];
      document.getElementById('active-player-name').innerText = nextColor;
      document.getElementById('turn-display').innerText = `Turn: ${nextColor}`;
      document.getElementById('rule-message').innerText = extraTurn ? "Extra Roll!" : "Roll the dice";
    }

    function startOfflineGame() {
      maxPlayers = parseInt(document.getElementById('player-count-select').value);
      renderBoard();
      showScreen('game-screen');
    }

    function hostGame() {
      isHost = true;
      const name = document.getElementById('player-name').value || 'Host';
      maxPlayers = document.getElementById('player-count-select').value;
      ws.send(JSON.stringify({ type: 'CREATE_ROOM', name, maxPlayers }));
    }

    function joinGame() {
      isHost = false;
      const name = document.getElementById('player-name').value || 'Player';
      const code = document.getElementById('room-code-input').value.trim();
      ws.send(JSON.stringify({ type: 'JOIN_ROOM', roomCode: code, name }));
    }

    function startGame() {
      broadcastP2P({ type: 'START_GAME' });
      renderBoard();
      showScreen('game-screen');
    }

    function createPeerConnection(peerId, isInitiator) {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      peerConnections[peerId] = pc;
      pc.onicecandidate = (e) => { if (e.candidate) ws.send(JSON.stringify({ type: 'ICE_CANDIDATE', candidate: e.candidate, targetId: peerId })); };
      if (isInitiator) {
        const dc = pc.createDataChannel('gameData');
        setupDataChannel(dc, peerId);
        pc.createOffer().then(o => { pc.setLocalDescription(o); ws.send(JSON.stringify({ type: 'OFFER', offer: o, targetId: peerId })); });
      } else {
        pc.ondatachannel = (e) => setupDataChannel(e.channel, peerId);
      }
      return pc;
    }

    function setupDataChannel(dc, peerId) {
      dataChannels[peerId] = dc;
      dc.onopen = () => { document.getElementById('peer-count').innerText = Object.keys(dataChannels).length + 1; };
      dc.onmessage = (e) => handleP2PMessage(JSON.parse(e.data));
    }

    function broadcastP2P(data) {
      Object.values(dataChannels).forEach(dc => { if (dc.readyState === 'open') dc.send(JSON.stringify(data)); });
    }

    function handleP2PMessage(data) {
      if (data.type === 'START_GAME') { renderBoard(); showScreen('game-screen'); }
      if (data.type === 'DICE_ROLLED') { document.getElementById('dice-display').innerText = data.roll; }
      if (data.type === 'MOVE_MADE') { Object.assign(gameState, data.gameState); renderBoard(); }
    }
  </script>
</body>
</html>
